<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Dogbone and T-bone CNC relief comparison</title><desc id="desc">Two slot diagrams showing relief circles defined by cutter diameter.</desc>
<rect width="1100" height="520" rx="26" fill="#f6f4ef"/>
<text x="550" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="750" fill="#302820">CNC corner relief options</text>
<g transform="translate(80 105)">
  <text x="210" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#302820">Dogbone</text>
  <rect x="75" y="105" width="270" height="90" rx="2" fill="#dedbd4" stroke="#322a22" stroke-width="5"/>
  <g fill="#f6f4ef" stroke="#322a22" stroke-width="4"><circle cx="92" cy="122" r="28"/><circle cx="328" cy="122" r="28"/><circle cx="92" cy="178" r="28"/><circle cx="328" cy="178" r="28"/></g>
  <g stroke="#bf3f36" stroke-width="3" stroke-dasharray="8 6"><line x1="92" y1="122" x2="75" y2="105"/><line x1="328" y1="122" x2="345" y2="105"/><line x1="92" y1="178" x2="75" y2="195"/><line x1="328" y1="178" x2="345" y2="195"/></g>
  <text x="210" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#65594d">Cutter centers move on the 45° corner bisector</text>
</g>
<g transform="translate(610 105)">
  <text x="210" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#302820">T-bone</text>
  <rect x="75" y="105" width="270" height="90" rx="2" fill="#dedbd4" stroke="#322a22" stroke-width="5"/>
  <g fill="#f6f4ef" stroke="#322a22" stroke-width="4"><circle cx="103" cy="105" r="28"/><circle cx="317" cy="105" r="28"/><circle cx="103" cy="195" r="28"/><circle cx="317" cy="195" r="28"/></g>
  <g stroke="#bf3f36" stroke-width="3" stroke-dasharray="8 6"><line x1="103" y1="105" x2="103" y2="78"/><line x1="317" y1="105" x2="317" y2="78"/><line x1="103" y1="195" x2="103" y2="222"/><line x1="317" y1="195" x2="317" y2="222"/></g>
  <text x="210" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#65594d">Cutter centers move normal to the slot wall</text>
</g>
<g transform="translate(325 405)">
  <line x1="0" y1="0" x2="450" y2="0" stroke="#302820" stroke-width="3"/><line x1="0" y1="-10" x2="0" y2="10" stroke="#302820" stroke-width="3"/><line x1="450" y1="-10" x2="450" y2="10" stroke="#302820" stroke-width="3"/>
  <text x="225" y="-14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#302820">relief radius = bit_diameter / 2</text>
</g>
</svg>